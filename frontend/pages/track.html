<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order | Grounds &amp; Groves</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/track.css">
</head>
<body data-page="track" data-root="../">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-title"><div class="wrap"><h1>Track your order</h1><p>Enter your order number and the phone number you used.</p></div></section>
    <section class="section"><div class="wrap track-grid">
      <form id="track-form" class="card form" novalidate>
        <div class="field"><label for="oid">Order number</label><input id="oid" inputmode="numeric" required></div>
        <div class="field"><label for="ophone">Phone number</label><input id="ophone" type="tel" required></div>
        <div id="track-msg" class="alert" hidden role="alert"></div>
        <button class="btn" type="submit">Check status</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/localdb.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/track.js"></script>
</body>
</html>
