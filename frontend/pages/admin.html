<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff dashboard | Grounds &amp; Groves</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="admin" data-root="../">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-title"><div class="wrap"><h1>Staff dashboard</h1><p>See new orders and bookings, and update their status.</p></div></section>
    <section class="section"><div class="wrap">
      <form id="login" class="card form login" novalidate>
        <div class="field"><label for="key">Staff key</label><input id="key" type="password" autocomplete="current-password" required>
          <small>Demo key: <code>grove123</code></small></div>
        <div id="login-msg" class="alert" hidden role="alert"></div>
        <button class="btn" type="submit">Open dashboard</button>
      </form>
      <div id="panel" hidden>
        <div class="stats" id="stats"></div>
        <div class="tabbar" role="tablist">
          <button class="chip" role="tab" aria-pressed="true" data-tab="orders">Orders</button>
          <button class="chip" role="tab" aria-pressed="false" data-tab="reservations">Reservations</button>
          <button class="chip" role="tab" aria-pressed="false" data-tab="messages">Messages</button>
          <button class="btn ghost small" id="refresh">Refresh</button>
          <button class="btn ghost small" id="logout">Log out</button>
        </div>
        <div id="admin-msg" class="alert" hidden role="alert"></div>
        <div id="table-box" class="table-box"></div>
      </div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/localdb.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
