<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Grounds &amp; Groves</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/menu.css">
</head>
<body data-page="menu" data-root="../">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-title"><div class="wrap"><h1>Menu</h1><p>Everything is made fresh each day. Vegetarian items are marked with a green dot.</p></div></section>
    <section class="section"><div class="wrap">
      <div class="tools">
        <div class="field"><label for="search">Search the menu</label><input id="search" type="search" placeholder="Try latte, brownie, sandwich"></div>
        <label class="veg-toggle"><input type="checkbox" id="veg-only"> Vegetarian only</label>
      </div>
      <div id="filters" class="filters" role="group" aria-label="Filter by category"></div>
      <div id="menu-list" aria-live="polite"><p>Loading the menu...</p></div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/localdb.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
